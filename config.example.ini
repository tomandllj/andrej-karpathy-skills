; 复制本文件为 config.ini（与 run.py / exe 同目录），再改成自己的值。
; 建议 username / password / login_path 都用足够长的随机串，降低被猜中风险。
[admin]
username = change-me-username
password = change-me-password
login_path = /change-me-login-path

; 功能开关（1 / on / true / yes 为开，其余值或没写为关/默认开），改完需重启
[features]
; 分享页光标 + 作者页光标显示 + 作者首页实时刷新
oncursor = 1
; 右下角在线人数悬浮卡（作者页和分享页都显示）
online = 1
